<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radio CO</title>
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="Radio sin publicidad: Olímpica Stéreo Ibagué y La Mega Bogotá.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* Fondo mas profundo y superficies sin borde: el contraste lo dan los
     propios tonos, no las lineas de 1px. */
  --bg:#080b10; --card:#141a23; --card2:#1c242f; --pill:#222b37;
  --txt:#f2f6fa; --dim:#8494a6; --dim2:#5d6b7c;
  --ok:#34d399; --warn:#fbbf24; --err:#f87171;
}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:env(safe-area-inset-top) 20px calc(20px + env(safe-area-inset-bottom));
}
.wrap{width:100%;max-width:540px;display:flex;flex-direction:column;padding-top:26px}

/* ---- cabecera: la hora manda ---- */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.clock{
  font-size:46px;font-weight:700;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums;
}
.date{color:var(--dim);font-size:13px;margin-top:6px;text-transform:capitalize}
.data{font-size:11px;color:var(--dim2);text-align:right;line-height:1.5}
.data b{display:block;color:var(--txt);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.reset{
  background:none;border:0;color:var(--dim2);font-size:11px;cursor:pointer;
  padding:2px 0 0;text-decoration:underline;
}

.label{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim2);margin:34px 0 12px;
}

/* ---- emisoras ---- */
#list{display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--card);border:2px solid transparent;border-radius:24px;
  padding:18px;cursor:pointer;transition:background .18s,border-color .18s;
}
.card:hover{background:var(--card2)}
.card.on{background:var(--card2);border-color:color-mix(in srgb,var(--accent) 47%,transparent)}
.top{display:flex;align-items:center;gap:16px}
.btn{
  flex:none;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:#08111a;display:grid;place-items:center;
}
.btn svg{width:24px;height:24px;fill:currentColor}
.meta{flex:1;min-width:0}
.meta .n{font-weight:700;font-size:20px;letter-spacing:-.02em}
.meta .c{color:var(--dim);font-size:13px;margin-top:3px}
.tag{
  flex:none;font-size:11px;color:var(--dim2);text-align:right;line-height:1.4;
  font-variant-numeric:tabular-nums;
}
.card.on .tag{display:none}

/* ---- ecualizador: se mueve solo mientras suena ---- */
.eq{display:none;align-items:flex-end;gap:3px;height:22px;flex:none}
.card.on .eq{display:flex}
.eq i{width:4px;height:100%;background:var(--accent);border-radius:2px;transform-origin:bottom;
      animation:eq .52s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-duration:.66s;animation-delay:.09s}
.eq i:nth-child(3){animation-duration:.42s;animation-delay:.18s}
@keyframes eq{from{transform:scaleY(.22)}to{transform:scaleY(1)}}

/* ---- lo que solo sale cuando se sabe que suena ---- */
.expand{display:none;margin-top:16px}
.card.on .expand{display:block}
.expand .s{font-size:15px;line-height:1.4;color:var(--txt);overflow-wrap:anywhere}
.expand .s.dim{color:var(--dim)}
.pills{display:none;gap:8px;margin-top:14px;flex-wrap:wrap}
.pills.visible{display:flex}
.pill{
  display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;
  background:var(--pill);color:var(--txt);border-radius:100px;
  padding:9px 16px;font-size:13px;font-weight:700;font-family:inherit;
}
.pill:hover{background:#2b3644}
.pill svg{width:18px;height:18px;fill:var(--accent);display:block}

/* ---- letra / karaoke ---- */
#lyr{background:var(--card);border-radius:24px;padding:18px;margin-top:12px;
     display:flex;flex-direction:column;gap:12px}
.lyrhead{display:flex;align-items:flex-start;gap:10px}
.lyrtit{font-weight:700;font-size:16px;letter-spacing:-.02em}
.lyrsub{color:var(--dim);font-size:12px;margin-top:2px}
.lyrx{
  margin-left:auto;flex:none;background:var(--pill);border:0;color:var(--dim);
  font-size:14px;cursor:pointer;line-height:1;border-radius:100px;
  width:32px;height:32px;display:grid;place-items:center;
}
.lyrx:hover{color:var(--txt)}
.lyrbody{
  max-height:44vh;overflow-y:auto;scroll-behavior:smooth;padding:4px 0;
  mask-image:linear-gradient(180deg,transparent,#000 34px,#000 calc(100% - 34px),transparent);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 34px,#000 calc(100% - 34px),transparent);
}
.lyrbody .ln{
  padding:6px 2px;font-size:17px;line-height:1.35;color:var(--dim2);
  transition:color .2s,opacity .2s;
}
.lyrbody .ln.now{color:var(--txt);font-weight:700}
.lyrbody .ln.done{opacity:.42}
.lyrbody.plana .ln{color:var(--txt);opacity:1;font-size:15px}
.lyrmsg{color:var(--dim);font-size:13px;padding:6px 2px}
.lyrsync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.lyrsync button{
  background:var(--pill);color:var(--txt);border:0;border-radius:100px;
  padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;
  font-variant-numeric:tabular-nums;font-family:inherit;
}
.lyrsync button:hover{background:#2b3644}
.lyrsync .off{color:var(--txt);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.lyrsync .hint{flex:1 1 100%;font-size:11px;line-height:1.4;color:var(--dim2)}
</style>
</head>
<body data-state="idle">
<div class="wrap">

  <header>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="data">
      Datos de hoy<b id="mb">0,0</b> MB
      <button class="reset" id="reset" type="button">reiniciar</button>
    </div>
  </header>

  <div class="label">Emisoras</div>
  <div id="list"></div>

  <div class="panel" id="lyr" hidden>
    <div class="lyrhead">
      <div>
        <div class="lyrtit" id="lyrTit"></div>
        <div class="lyrsub" id="lyrSub"></div>
      </div>
      <button class="lyrx" id="lyrClose" type="button" aria-label="Cerrar la letra">✕</button>
    </div>
    <div class="lyrbody" id="lyrBody"></div>
    <div class="lyrsync" id="lyrSync" hidden>
      <button type="button" id="lyrMenos">−1 s</button>
      <span class="off" id="lyrOff">0 s</span>
      <button type="button" id="lyrMas">+1 s</button>
      <span class="hint">Si la letra va adelantada, resta segundos. Si va atrasada, suma.</span>
    </div>
  </div>

</div>

<script>
"use strict";

var STATIONS = [
  {
    id: "olimpica-ibague", name: "Olímpica Stéreo", city: "Ibagué · 94.3 FM", accent: "#fb7185",
    streams: [
      { url: "https://playerservices.streamtheworld.com/api/livestream-redirect/OLP_IBAGUEAAC.aac", kbps: 64, label: "AAC 64k" },
      { url: "https://playerservices.streamtheworld.com/api/livestream-redirect/OLP_IBAGUE.mp3", kbps: 96, label: "MP3 96k" }
    ],
    // Olimpica publica lo que suena en la API de Triton (y permite CORS)
    triton: "OLP_IBAGUEAAC"
  },
  {
    id: "lamega-bogota", name: "La Mega", city: "Bogotá · 90.9 FM", accent: "#38bdf8",
    streams: [
      { url: "https://mdstrm.com/audio/632c9ae6660fef03fe3855fe/icecast.audio", kbps: 128, label: "AAC 128k" }
    ]
    // La Mega solo lo manda dentro del stream (metadatos ICY), y un <audio>
    // del navegador no puede leerlos. Por eso aqui no se muestra la cancion.
  }
];

var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
var ICON_STOP = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
/* lineas de texto: la letra de la cancion */
var ICON_LYRICS =
  '<svg viewBox="0 0 24 24">' +
  '<path d="M4,6h16v2H4V6z M4,10h11v2H4V10z M4,14h16v2H4V14z M4,18h11v2H4V18z"/>' +
  '</svg>';
/* nota musical + flecha de "abrir fuera" */
var ICON_MUSIC =
  '<svg viewBox="0 0 24 24">' +
  '<path d="M11,4v8.55C10.59,12.21 10.07,12 9.5,12A2.5,2.5 0 1 0 12,14.5V7h2.5V4H11z"/>' +
  '<path d="M17.5,4h-1.2v1.4h2.31l-3.2,3.2 0.99,0.99 3.2,-3.2v2.31H21V4h-3.5z"/>' +
  '</svg>';

function $(s) { return document.querySelector(s); }
var list = $("#list");

var audio = new Audio();
audio.preload = "none";

var current = null;   // emisora sonando
var variant = 0;      // indice del stream dentro de la emisora
var retries = 0;
var retryTimer = null;
var stallTimer = null;
var lastStation = STATIONS[0];
var song = null;        // lo que suena ahora, si la emisora lo publica
var songTimer = null;
var songArtista = null; // partes sin juntar, para buscar la letra
var songTitulo = null;
var cueStart = 0;       // epoch ms en que la EMISORA empezo la cancion
var cueDur = 0;         // duracion en ms, para elegir bien la version

/* Retardo tipico entre lo que emite la emisora y lo que oyes: buffer del
   reproductor mas el del CDN. No se puede medir desde aqui, asi que se parte
   de una estimacion y el usuario la afina con los botones de +/- segundos. */
var LATENCIA_BASE_MS = 20000;
var offsetMs = 0;

var letra = null;       // {lineas:[{t,txt}], sincronizada:bool, ref:"artista - titulo"}
var letraClave = null;  // cancion para la que se pidio (evita repetir peticiones)
var letraEstado = "";
var letraAbierta = false;
var lineaActual = -1;

/* ---------- reloj ---------- */
/* La fecha va en espanol a proposito: la app entera esta en espanol y con el
   idioma del navegador saldria "Monday, 7 September". */
var DIAS = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio",
             "agosto","septiembre","octubre","noviembre","diciembre"];

function paintClock() {
  var d = new Date();
  $("#clock").textContent =
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  $("#date").textContent =
    DIAS[d.getDay()] + ", " + d.getDate() + " de " + MESES[d.getMonth()];
}
paintClock();

/* ---------- contador de datos (por dia, en localStorage) ---------- */
function today() { return new Date().toISOString().slice(0, 10); }
function loadUsage() {
  try {
    var d = JSON.parse(localStorage.getItem("radioco.data") || "{}");
    if (d.day !== today()) return { day: today(), bytes: 0 };
    return { day: d.day, bytes: d.bytes || 0 };
  } catch (e) { return { day: today(), bytes: 0 }; }
}
var usage = loadUsage();
function saveUsage() { try { localStorage.setItem("radioco.data", JSON.stringify(usage)); } catch (e) {} }
function paintUsage() {
  if (usage.day !== today()) usage = { day: today(), bytes: 0 };
  $("#mb").textContent = (usage.bytes / 1048576).toFixed(1).replace(".", ",");
}
paintUsage();
$("#reset").onclick = function (e) {
  e.stopPropagation();
  usage = { day: today(), bytes: 0 };
  saveUsage(); paintUsage();
};

/* ---------- tarjetas ---------- */
STATIONS.forEach(function (st) {
  var el = document.createElement("div");
  el.className = "card";
  el.style.setProperty("--accent", st.accent);
  el.dataset.id = st.id;
  var mbh = (st.streams[0].kbps * 3600 / 8 / 1024).toFixed(0);
  el.innerHTML =
    '<div class="top">' +
      '<button class="btn" type="button" aria-label="Reproducir ' + st.name + '">' + ICON_PLAY + "</button>" +
      '<div class="meta"><div class="n">' + st.name + "</div>" +
      '<div class="c">' + st.city + "</div></div>" +
      '<div class="eq" aria-hidden="true"><i></i><i></i><i></i></div>' +
      '<div class="tag">' + st.streams[0].label + "<br>~" + mbh + " MB/h</div>" +
    "</div>" +
    '<div class="expand">' +
      '<div class="s"></div>' +
      '<div class="pills">' +
        '<button class="pill ltr" type="button">' + ICON_LYRICS + "Letra</button>" +
        '<button class="pill ytm" type="button">' + ICON_MUSIC + "YouTube Music</button>" +
      "</div>" +
    "</div>";

  // los iconos van dentro de la tarjeta, que es el boton de play/stop:
  // hay que frenar la propagacion o se para la radio al pulsarlos
  el.querySelector(".ytm").onclick = function (e) {
    e.stopPropagation();
    if (song) abrirEnYouTubeMusic(song);
  };
  el.querySelector(".ltr").onclick = function (e) {
    e.stopPropagation();
    abrirLetra();
  };
  el.onclick = function () { toggle(st); };
  list.appendChild(el);
});

function cardOf(st) { return list.querySelector('[data-id="' + st.id + '"]'); }
function status(st, text) { var c = cardOf(st); if (c) c.querySelector(".s").textContent = text || ""; }
function setState(s) { document.body.dataset.state = s; }
function streamOf(st) { return st.streams[variant % st.streams.length]; }

function paintCards() {
  STATIONS.forEach(function (st) {
    var c = cardOf(st), on = !!(current && current.id === st.id);
    c.classList.toggle("on", on);
    c.querySelector(".btn").innerHTML = on ? ICON_STOP : ICON_PLAY;
    if (!on) status(st, "");
  });
}

/* ---------- que suena ahora ---------- */
/* Solo para emisoras con API de Triton. La Mega manda el titulo dentro del
   propio stream (metadatos ICY) y un <audio> del navegador no puede leerlos:
   eso solo lo puede hacer la app de Android. */
var BASURA = ["", "-", "--", "unknown", "unknown - unknown", "null", "n/a",
              "advertisement", "publicidad", "comerciales"];

function limpiar(v) {
  if (!v) return null;
  v = v.replace(/^[\s-]+|[\s-]+$/g, "");
  if (v.length < 2) return null;
  if (BASURA.indexOf(v.toLowerCase()) !== -1) return null;
  return v;
}

/* Las emisoras suelen mandarlo TODO EN MAYUSCULAS y grita mucho. */
function bonito(v) {
  if (v !== v.toUpperCase()) return v;
  return v.split(" ").map(function (w) {
    return w.length <= 1 ? w : w[0].toUpperCase() + w.slice(1).toLowerCase();
  }).join(" ");
}

function componer(artista, titulo) {
  var a = limpiar(artista), t = limpiar(titulo);
  if (a && t) return bonito(a) + " · " + bonito(t);
  if (t) return bonito(t);
  if (a) return bonito(a);
  return null;
}

function pararCancion() {
  clearTimeout(songTimer);
  songTimer = null;
  song = null;
  songArtista = null;
  songTitulo = null;
  cueStart = 0;
  cueDur = 0;
  letra = null;
  letraClave = null;
  letraEstado = "";
  lineaActual = -1;
  [].forEach.call(document.querySelectorAll(".pills"), function (b) {
    b.classList.remove("visible");
  });
  if (letraAbierta) pintarLetra();
}

/* Expresiones literales a proposito: construirlas desde un string obliga a
   escapar dos veces y es facil equivocarse. */
var RX = {
  titulo:   /cue_title"><!\[CDATA\[([\s\S]*?)\]\]>/,
  artista:  /track_artist_name"><!\[CDATA\[([\s\S]*?)\]\]>/,
  duracion: /cue_time_duration"><!\[CDATA\[(\d+)\]\]>/,
  inicio:   /cue_time_start"><!\[CDATA\[(\d+)\]\]>/
};

function extraer(xml, campo) {
  var m = xml.match(RX[campo]);
  return m ? m[1] : null;
}

function buscarCancion(st) {
  if (!st.triton || !current || current.id !== st.id) return;

  var url = "https://np.tritondigital.com/public/nowplaying?mountName=" +
            encodeURIComponent(st.triton) + "&numberToFetch=1&eventType=track";

  fetch(url, { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : null; })
    .then(function (xml) {
      if (!current || current.id !== st.id) return;
      var espera = 25000;
      if (xml) {
        var a = extraer(xml, "artista"), t = extraer(xml, "titulo");
        song = componer(a, t);
        songArtista = limpiar(a);
        songTitulo = limpiar(t);

        var dur = extraer(xml, "duracion"), ini = extraer(xml, "inicio");
        cueStart = ini ? +ini : 0;
        cueDur = dur ? +dur : 0;

        paintStatus(st);
        mediaMeta(st);

        if (songArtista && songTitulo) pedirLetra(songArtista, songTitulo, cueDur);
        else if (letraAbierta) { letra = null; letraClave = null; pintarLetra(); }

        // volver a preguntar justo cuando se acabe la cancion, no antes
        if (dur && ini) {
          espera = Math.min(60000, Math.max(15000, (+ini + +dur) - Date.now() + 3000));
        }
      }
      songTimer = setTimeout(function () { buscarCancion(st); }, espera);
    })
    .catch(function () {
      if (!current || current.id !== st.id) return;
      songTimer = setTimeout(function () { buscarCancion(st); }, 30000);
    });
}

function abrirEnYouTubeMusic(cancion) {
  // el separador queda bien en pantalla pero estorba al buscar
  var q = cancion.replace(" · ", " ").trim();
  window.open("https://music.youtube.com/search?q=" + encodeURIComponent(q),
              "_blank", "noopener");
}

/* Si la referencia de LRCLIB dice lo mismo que la cabecera, no se ensena dos
   veces. Se compara el titulo, y los artistas valen cuando uno es el principio
   del otro ("Ryan Castro" vs "Ryan Castro Ft Kapo"). */
function normalizar(v) {
  return v.toLowerCase()
    .replace(/[áàä]/g, "a").replace(/[éèë]/g, "e").replace(/[íìï]/g, "i")
    .replace(/[óòö]/g, "o").replace(/[úùü]/g, "u").replace(/ñ/g, "n")
    .replace(/[^a-z0-9]+/g, "");
}

function mismaCancion(a, b) {
  var pa = a.split(" · "), pb = b.split(" · ");
  if (pa.length < 2 || pb.length < 2) return normalizar(a) === normalizar(b);
  if (normalizar(pa[pa.length - 1]) !== normalizar(pb[pb.length - 1])) return false;
  var x = normalizar(pa[0]), y = normalizar(pb[0]);
  return x.indexOf(y) === 0 || y.indexOf(x) === 0;
}

function paintStatus(st) {
  if (!current || current.id !== st.id) return;
  var linea = cardOf(st).querySelector(".s");
  status(st, song ? "♪  " + song : "En directo · " + streamOf(st).label);
  if (linea) linea.classList.toggle("dim", !song);
  var pastillas = cardOf(st).querySelector(".pills");
  if (pastillas) pastillas.classList.toggle("visible", !!song);
}

/* ---------- letra / karaoke ---------- */
/* La letra viene de LRCLIB (lrclib.net): base comunitaria, gratis, sin clave y
   con CORS abierto. Trae formato LRC, con marca de tiempo por linea. */

/* Los titulos que mandan las emisoras traen ruido que rompe la busqueda:
   el anyo pegado al final, corchetes, "(En Vivo)"... */
function limpiarTitulo(t) {
  return t
    .replace(/\s*\((?:en\s+vivo|live|audio|video|official[^)]*)\)\s*/gi, " ")
    .replace(/\s*\[[^\]]*\]\s*/g, " ")
    .replace(/\s+(19|20)\d\d\s*$/, "")
    .replace(/\s+/g, " ")
    .trim();
}

/* "Ryan Castro, Kapo, Gangsta" -> "Ryan Castro" */
function primerArtista(a) {
  return a.split(/\s*(?:,|&|\/|\bfeat\.?\b|\bft\.?\b|\bcon\b)\s*/i)[0].trim();
}

function parsearLrc(txt) {
  var lineas = [];
  txt.split("\n").forEach(function (l) {
    var marcas = l.match(/\[\d+:\d+(?:[.:]\d+)?\]/g);
    if (!marcas) return;                       // [ar:], [by:]... se ignoran
    var texto = l.replace(/\[[^\]]*\]/g, "").trim();
    // Muchos LRC traen marcas sin texto para los silencios y el final. Si se
    // guardan, la linea "actual" acaba siendo una vacia y parece que el
    // karaoke se ha colgado.
    if (!texto) return;
    marcas.forEach(function (m) {
      var p = m.slice(1, -1).split(":");
      lineas.push({
        t: (+p[0]) * 60000 + Math.round(parseFloat(p[1].replace(",", ".")) * 1000),
        txt: texto
      });
    });
  });
  lineas.sort(function (a, b) { return a.t - b.t; });
  return lineas;
}

/* La duracion que da la emisora sirve para acertar con la version correcta
   (single, remix, en directo...) entre los resultados. */
function elegirVersion(lista, durMs) {
  var conSync = lista.filter(function (x) { return x.syncedLyrics; });
  var pool = conSync.length ? conSync : lista;
  if (!pool.length) return null;
  if (!durMs) return pool[0];
  return pool.slice().sort(function (a, b) {
    return Math.abs((a.duration || 0) * 1000 - durMs) -
           Math.abs((b.duration || 0) * 1000 - durMs);
  })[0];
}

function pedirLetra(artista, titulo, durMs) {
  var clave = artista + "|" + titulo;
  if (letraClave === clave) return;            // ya pedida para esta cancion
  letraClave = clave;
  letra = null;
  lineaActual = -1;
  letraEstado = "Buscando la letra…";
  if (letraAbierta) pintarLetra();

  var intentos = [
    { artist_name: artista, track_name: titulo },
    { artist_name: primerArtista(artista), track_name: limpiarTitulo(titulo) },
    { q: primerArtista(artista) + " " + limpiarTitulo(titulo) }
  ];

  function intentar(i) {
    if (letraClave !== clave) return;          // la cancion ya cambio
    if (i >= intentos.length) {
      letraEstado = "No he encontrado la letra de esta canción.";
      if (letraAbierta) pintarLetra();
      return;
    }
    var url = "https://lrclib.net/api/search?" +
              new URLSearchParams(intentos[i]).toString();
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (lista) {
        if (letraClave !== clave) return;
        var mejor = elegirVersion(lista || [], durMs);
        if (!mejor) return intentar(i + 1);

        var ref = (mejor.artistName || "") + " · " + (mejor.trackName || "");
        if (mejor.syncedLyrics) {
          letra = { lineas: parsearLrc(mejor.syncedLyrics), sincronizada: true, ref: ref };
        } else if (mejor.plainLyrics) {
          letra = {
            lineas: mejor.plainLyrics.split("\n").map(function (t) {
              return { t: null, txt: t };
            }),
            sincronizada: false,
            ref: ref
          };
        } else {
          return intentar(i + 1);
        }
        if (!letra.lineas.length) { letra = null; return intentar(i + 1); }
        letraEstado = "";
        lineaActual = -1;
        if (letraAbierta) pintarLetra();
      })
      .catch(function () { intentar(i + 1); });
  }
  intentar(0);
}

function abrirLetra() {
  letraAbierta = true;
  $("#lyr").hidden = false;
  pintarLetra();
  if (songArtista && songTitulo) pedirLetra(songArtista, songTitulo, cueDur);
  $("#lyr").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function cerrarLetra() {
  letraAbierta = false;
  $("#lyr").hidden = true;
}

function pintarLetra() {
  var body = $("#lyrBody");
  var titulo = song || "Nada sonando";
  $("#lyrTit").textContent = titulo;

  var ref = letra && letra.ref ? letra.ref : "";
  var sub = (ref && !mismaCancion(titulo, ref))
    ? ref
    : (current ? current.name + " · " + current.city : "");
  $("#lyrSub").textContent = sub;
  $("#lyrSync").hidden = !(letra && letra.sincronizada);
  body.classList.toggle("plana", !!(letra && !letra.sincronizada));

  if (!letra) {
    body.innerHTML = "";
    var msg = document.createElement("div");
    msg.className = "lyrmsg";
    msg.textContent = letraEstado ||
      (song ? "Buscando la letra…" : "Pon una emisora para ver la letra.");
    body.appendChild(msg);
    return;
  }

  body.innerHTML = "";
  letra.lineas.forEach(function (l) {
    var el = document.createElement("div");
    el.className = "ln";
    // textContent, no innerHTML: la letra es texto de fuera
    el.textContent = l.txt || " ";
    body.appendChild(el);
  });

  if (!letra.sincronizada) {
    var nota = document.createElement("div");
    nota.className = "lyrmsg";
    nota.textContent = "Esta letra no viene sincronizada, así que no se resalta.";
    body.appendChild(nota);
  }
  lineaActual = -1;
}

/* Por donde va la cancion, en ms. El dato de la emisora es de SU reloj: tu lo
   oyes mas tarde por el buffer, y esa diferencia es lo que ajusta el usuario. */
function posicionCancion() {
  if (!cueStart || !current || audio.paused) return null;
  return Date.now() - cueStart - (LATENCIA_BASE_MS + offsetMs);
}

function tickKaraoke() {
  if (!letraAbierta || !letra || !letra.sincronizada) return;
  var pos = posicionCancion();
  if (pos === null) return;

  var idx = -1;
  for (var i = 0; i < letra.lineas.length; i++) {
    if (letra.lineas[i].t <= pos) idx = i; else break;
  }
  if (idx === lineaActual) return;
  lineaActual = idx;

  var body = $("#lyrBody");
  var nodos = body.querySelectorAll(".ln");
  for (var j = 0; j < nodos.length; j++) {
    nodos[j].classList.toggle("now", j === idx);
    nodos[j].classList.toggle("done", j < idx);
  }
  if (idx >= 0 && nodos[idx]) {
    body.scrollTop = Math.max(
      0,
      nodos[idx].offsetTop - body.clientHeight / 2 + nodos[idx].offsetHeight / 2
    );
  }
}
setInterval(tickKaraoke, 250);

/* ---- ajuste de sincronismo ---- */
offsetMs = +(localStorage.getItem("radioco.offset") || 0);

function pintarOffset() {
  var s = Math.round(offsetMs / 1000);
  $("#lyrOff").textContent = (s > 0 ? "+" : "") + s + " s";
}

function ajustarOffset(d) {
  offsetMs = Math.max(-60000, Math.min(60000, offsetMs + d));
  try { localStorage.setItem("radioco.offset", offsetMs); } catch (e) {}
  pintarOffset();
  lineaActual = -1;
  tickKaraoke();
}

$("#lyrMenos").onclick = function () { ajustarOffset(-1000); };
$("#lyrMas").onclick = function () { ajustarOffset(1000); };
$("#lyrClose").onclick = cerrarLetra;
pintarOffset();

/* ---------- reproduccion ---------- */
function clearTimers() {
  clearTimeout(retryTimer); clearTimeout(stallTimer);
  retryTimer = null; stallTimer = null;
}

function stop() {
  clearTimers();
  pararCancion();
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  if (current) lastStation = current;
  current = null; variant = 0; retries = 0;
  setState("idle");
  paintCards();
  document.title = "Radio CO";
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "none";
}

function play(st, keepRetries) {
  clearTimers();
  if (!current || current.id !== st.id) pararCancion();
  current = st;
  if (!keepRetries) { retries = 0; variant = 0; }
  var s = streamOf(st);
  setState("loading");
  paintCards();
  status(st, retries ? "Reconectando… (" + retries + ")" : "Conectando…");
  // el parametro evita reutilizar una conexion muerta guardada en cache
  var sep = s.url.indexOf("?") === -1 ? "?" : "&";
  audio.src = s.url + sep + "_=" + Date.now();
  audio.load();
  var p = audio.play();
  if (p && p.catch) {
    p.catch(function () {
      status(st, "Toca el botón para reproducir");
      setState("error");
    });
  }
  armStall();
  mediaMeta(st);
}

function toggle(st) {
  if (current && current.id === st.id) stop(); else play(st);
}

function armStall() {
  clearTimeout(stallTimer);
  stallTimer = setTimeout(function () {
    if (current && !audio.paused && audio.readyState < 3) reconnect("sin datos");
  }, 12000);
}

function reconnect(why) {
  if (!current) return;
  var st = current;
  retries++;
  variant++;   // prueba el siguiente stream de la misma emisora
  var wait = Math.min(15000, 1000 * Math.pow(2, Math.min(retries, 4)));
  setState("error");
  status(st, "Sin señal (" + why + "). Reintento en " + Math.round(wait / 1000) + " s");
  clearTimers();
  retryTimer = setTimeout(function () {
    if (current && current.id === st.id) play(st, true);
  }, wait);
}

audio.addEventListener("playing", function () {
  if (!current) return;
  retries = 0;
  clearTimeout(stallTimer);
  setState("playing");
  paintStatus(current);
  document.title = current.name + " · en directo";
  if (current.triton && !songTimer) buscarCancion(current);
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
});
audio.addEventListener("waiting", function () {
  if (!current) return;
  setState("loading"); status(current, "Cargando…"); armStall();
});
audio.addEventListener("stalled", function () { armStall(); });
audio.addEventListener("error", function () { if (current) reconnect("error de red"); });
audio.addEventListener("ended", function () { if (current) reconnect("conexión cerrada"); });

/* ---------- tick: contador de datos + temporizador ---------- */
setInterval(function () {
  paintClock();
  if (current && !audio.paused && document.body.dataset.state === "playing") {
    usage.bytes += streamOf(current).kbps * 1000 / 8;
    paintUsage(); saveUsage();
  }
}, 1000);

/* ---------- controles del sistema / pantalla de bloqueo ---------- */
function mediaMeta(st) {
  if (!("mediaSession" in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song || st.name,
      artist: song ? st.name : st.city,
      album: "Radio CO",
      artwork: [{ src: "icon-512.png", sizes: "512x512", type: "image/png" }]
    });
  } catch (e) {}
  navigator.mediaSession.setActionHandler("play", function () { play(st); });
  navigator.mediaSession.setActionHandler("pause", function () { stop(); });
  navigator.mediaSession.setActionHandler("stop", function () { stop(); });
}

/* espacio = play/stop de la ultima emisora */
document.addEventListener("keydown", function (e) {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault();
    if (current) stop(); else play(lastStation);
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
